[project]
name = "pyclidata"
version = "0.2.0"
description = "Simple connection helpers for a CLIDATA (or other) Oracle database"
authors = [
    { name = "Ousmane Ouedraogo", email = "oousmane@proton.me" },
    { name = "Adaman Yoda", email = "adamouyod@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "oracledb>=2.0",
    "keyring>=24",
    "pandas>=2.0",
    "ibis-framework[oracle]>=9.0",
    "packaging>=23",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0", "twine>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyclidata"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64", "win-64"]

[tool.pixi.dependencies]
# Pinned below the newest CPython so pypi wheels (e.g. cryptography, a
# transitive dep of oracledb's thin-mode crypto) are prebuilt rather than
# needing a from-source Rust build.
python = "3.12.*"

# Some Oracle DB accounts (e.g. CLIDATA's, on old/legacy password
# verifiers) can't authenticate over oracledb's pure-Python thin mode at
# all (DPY-3015) -- only python-oracledb's thick mode, backed by the
# native Oracle Instant Client, supports those. Installed only where
# conda-forge publishes it; connect.py auto-detects and upgrades to
# thick mode when present, and falls back to thin mode otherwise (see
# oracledb's own documented pattern for this).
[tool.pixi.target.osx-64.dependencies]
oracle-instant-client = "*"

[tool.pixi.target.linux-64.dependencies]
oracle-instant-client = "*"

[tool.pixi.pypi-dependencies]
pyclidata = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest"
build-dist = "rm -rf dist && python -m build"
check-dist = "twine check dist/*"
